</style></head><body><main><div class="eyebrow">CASTREADER / ELECTRON EXPERIMENT</div><h1>声音与原文，使用同一个时钟。</h1><p class="note">独立桌面实验程序 · 真实 CastReader 音频与时间戳 · 尚未接入 Codex 主窗口</p><section class="card"><label>原文 DOM · 保留链接与行内格式</label><article id="answer"><p>Hello. <strong>Cast<span>Reader</span></strong> turns your <a href="#ideas">ideas</a> into <em>playable audio.</em></p></article><audio id="audio" src="audio.wav" controls preload="auto"></audio><div class="row"><button id="play" class="primary">播放指读</button><button id="stop">停止并清除</button><select id="rate" aria-label="播放速度"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="jump">跳到 ideas</button></div><p class="readout" id="state"></p></section><section class="card"><label>实验结果</label><p id="summary">等待验证。</p><div class="checks" id="checks"></div></section><footer>高亮由 audio.currentTime 驱动；不按文字长度估算时间。此程序仅验证同步机制，不证明第三方插件能访问 Codex 的主回答。</footer></main><script src="fixture.js"></script><script type="module" src="renderer.mjs"></script></body></html>
